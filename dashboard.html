<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="ui.css">
    <title>Tab Vault 工作区总览</title>
  </head>
  <body class="dashboard-body">
    <main class="dashboard-shell">
      <header class="dashboard-header">
        <div>
          <p class="eyebrow">TAB VAULT</p>
          <h1>工作区</h1>
          <p class="subtitle">这里放着你暂时离开的网页现场。</p>
        </div>
        <div class="dashboard-actions">
          <button id="backup-toggle" class="icon-command" type="button">备份</button>
          <button id="trash-toggle" class="icon-command" type="button">回收站 <span id="trash-count"></span></button>
          <button id="appearance-toggle" class="icon-command" type="button">外观</button>
        </div>
      </header>
      <section class="timeline-board">
        <section id="backup-panel" class="tool-panel backup-panel" hidden>
          <button id="backup-close" class="tool-panel-close" type="button" aria-label="关闭备份面板">×</button>
          <div class="tool-panel-heading">
            <h2>备份与导入</h2>
            <span id="backup-selection-count">未选择工作区</span>
          </div>
          <div class="backup-actions">
            <button id="export-all" class="button" type="button">导出全部</button>
            <button id="export-selected" class="button" type="button" disabled>导出已选</button>
            <button id="pin-selected" class="button" type="button" disabled>置顶已选</button>
            <button id="unpin-selected" class="button" type="button" disabled>取消置顶</button>
            <button id="trash-selected" class="button button-danger" type="button" disabled>移入回收站</button>
            <label class="button file-button">导入备份
              <input id="import-file" type="file" accept=".json,.tabvault.json,application/json">
            </label>
          </div>
          <div class="storage-health">
            <div><span>本地空间</span><span id="storage-label"></span></div>
            <progress id="storage-meter" max="1" value="0"></progress>
          </div>
          <div id="import-preview" class="import-preview" hidden>
            <p id="import-preview-text"></p>
            <div>
              <button id="import-confirm" class="button button-restore" type="button">确认导入</button>
              <button id="import-cancel" class="button" type="button">取消</button>
            </div>
          </div>
        </section>
        <section id="trash-panel" class="tool-panel trash-panel" hidden>
          <button id="trash-close" class="tool-panel-close" type="button" aria-label="关闭回收站">×</button>
          <div class="tool-panel-heading">
            <h2>回收站</h2>
            <button id="empty-trash" class="button button-danger" type="button">清空</button>
          </div>
          <div id="trash-list" class="trash-list"></div>
        </section>
        <form id="appearance-panel" class="appearance-panel" hidden>
          <button id="appearance-close" class="appearance-close" type="button" aria-label="关闭外观设置">×</button>
          <label class="background-file-control">上传背景
            <input id="background-file" type="file" accept="image/png,image/jpeg,image/webp">
            <small>支持 PNG、JPEG、WebP，小于 5 MB</small>
          </label>
          <label class="background-dim-control">遮罩强度
            <input id="background-dim" type="range" min="45" max="92" value="78">
          </label>
          <label class="accent-color-control">主题色
            <input id="accent-color" type="color" value="#c5e36b">
          </label>
          <button id="background-remove" class="button button-danger" type="button">移除背景</button>
        </form>
        <label class="workspace-search">搜索工作区
          <input id="workspace-search" type="search" placeholder="名称、网页标题或网站">
        </label>
        <section id="undo-bar" class="undo-bar dashboard-undo" hidden>
          <span id="undo-text"></span>
          <button id="undo-save" type="button">撤销</button>
        </section>
        <div class="section-heading">
          <h2>已保存的工作区</h2>
          <div class="section-heading-meta">
            <span id="storage-warning" class="storage-warning" hidden>本地空间接近上限</span>
            <span id="workspace-count"></span>
          </div>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
        <section id="restore-progress" class="restore-progress" hidden aria-live="polite">
          <div>
            <span id="restore-progress-text">正在准备恢复…</span>
            <span id="restore-progress-count"></span>
          </div>
          <progress id="restore-progress-meter" max="1" value="0"></progress>
        </section>
        <section id="restore-report" class="restore-report" hidden>
          <span id="restore-report-text"></span>
          <div>
            <button id="retry-restore" class="button button-restore" type="button">重试失败项</button>
            <button id="dismiss-restore-report" class="report-close" type="button" aria-label="关闭恢复结果">×</button>
          </div>
        </section>
        <div id="workspace-list" class="workspace-list dashboard-list"></div>
        <button id="load-more" class="button load-more" type="button" hidden></button>
      </section>
    </main>
    <script type="module" src="dashboard.js"></script>
  </body>
</html>
